[package]
name = "asr-policy-manager"
version = "0.1.0"
edition = "2021"
description = "Interactive terminal manager for Microsoft Defender ASR exclusions"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
